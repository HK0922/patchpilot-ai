name: Feature request
description: Propose a scoped improvement with a clear user outcome.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this, and what task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Acceptance criteria and validation
      description: What observable result would show this works?
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Constraints and tradeoffs
      description: Consider scope, cost, isolation, and human review.
